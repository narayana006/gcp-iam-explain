name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on examples
        run: |
          gcp-iam-explain examples/project-policy.json --allowed-domains example.com || test $? -eq 1
          gcp-iam-explain examples/bucket-policy.json --format json > /dev/null || test $? -eq 1
          gcp-iam-explain examples/clean-policy.json --allowed-domains example.com
